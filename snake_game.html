<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>贪吃蛇 🐍</title>
  <style>
    /* ===== 全局重置 & 布局 ===== */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(145deg, #0b1a2e 0%, #1a2f3f 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    .game-wrapper {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(12px);
      border-radius: 32px;
      padding: 32px 40px 40px 40px;
      box-shadow:
        0 30px 60px rgba(0, 0, 0, 0.6),
        inset 0 1px 0 rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.06);
    }

    /* ===== 顶部信息栏 ===== */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      padding: 0 4px;
    }

    .title {
      font-size: 26px;
      font-weight: 700;
      color: #e8f0fe;
      letter-spacing: 1px;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
    }
    .title .snake-icon {
      display: inline-block;
      animation: bounce 1.8s infinite ease-in-out;
    }
    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50%      { transform: translateY(-4px); }
    }

    .score-board {
      display: flex;
      gap: 28px;
    }
    .score-board > div {
      text-align: center;
    }
    .score-board .label {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: rgba(255, 255, 255, 0.4);
    }
    .score-board .value {
      font-size: 28px;
      font-weight: 700;
      color: #f0d78c;
      line-height: 1.2;
      min-width: 40px;
    }
    .score-board .value.high {
      color: #7fc8a8;
    }

    /* ===== 画布容器 ===== */
    .canvas-container {
      position: relative;
      border-radius: 16px;
      overflow: hidden;
      box-shadow:
        0 0 0 1px rgba(255, 255, 255, 0.06),
        0 20px 40px rgba(0, 0, 0, 0.5);
    }

    canvas {
      display: block;
      width: 480px;
      height: 480px;
      background: #0f1f2b;
      background-image:
        radial-gradient(ellipse at 20% 30%, rgba(60, 150, 200, 0.08) 0%, transparent 60%),
        radial-gradient(ellipse at 80% 70%, rgba(200, 180, 80, 0.05) 0%, transparent 60%);
    }

    /* ===== 覆盖层（开始 / 结束） ===== */
    .overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(4px);
      transition: opacity 0.3s ease;
      cursor: pointer;
    }
    .overlay.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .overlay .big-icon {
      font-size: 64px;
      margin-bottom: 8px;
    }
    .overlay .primary-text {
      font-size: 26px;
      font-weight: 700;
      color: #fff;
      margin-bottom: 6px;
    }
    .overlay .secondary-text {
      font-size: 14px;
      color: rgba(255, 255, 255, 0.55);
      margin-bottom: 18px;
    }
    .overlay .btn {
      padding: 10px 32px;
      border: none;
      border-radius: 40px;
      background: linear-gradient(135deg, #3b9e6d, #2d7d55);
      color: #fff;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.12s, box-shadow 0.2s;
      box-shadow: 0 4px 14px rgba(45, 125, 85, 0.35);
    }
    .overlay .btn:hover {
      transform: scale(1.04);
      box-shadow: 0 6px 22px rgba(45, 125, 85, 0.5);
    }
    .overlay .btn:active {
      transform: scale(0.96);
    }

    /* ===== 底部操作提示 ===== */
    .footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 16px;
      padding: 0 4px;
    }
    .footer .hint {
      font-size: 13px;
      color: rgba(255, 255, 255, 0.3);
    }
    .footer .hint kbd {
      display: inline-block;
      padding: 2px 8px;
      margin: 0 2px;
      border-radius: 4px;
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid rgba(255, 255, 255, 0.08);
      font-family: inherit;
      font-size: 12px;
      color: rgba(255, 255, 255, 0.5);
    }

    .restart-btn {
      padding: 6px 20px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 30px;
      background: transparent;
      color: rgba(255, 255, 255, 0.45);
      font-size: 13px;
      cursor: pointer;
      transition: all 0.15s;
    }
    .restart-btn:hover {
      background: rgba(255, 255, 255, 0.06);
      color: #fff;
      border-color: rgba(255, 255, 255, 0.2);
    }

    /* ===== 响应式 ===== */
    @media (max-width: 560px) {
      .game-wrapper {
        padding: 16px 16px 24px 16px;
        border-radius: 20px;
      }
      canvas {
        width: 100%;
        height: auto;
        aspect-ratio: 1 / 1;
      }
      .title { font-size: 20px; }
      .score-board .value { font-size: 22px; }
      .footer { flex-wrap: wrap; gap: 8px; }
    }
  </style>
</head>
<body>

<div class="game-wrapper">
  <!-- 顶部 -->
  <div class="header">
    <div class="title">
      <span class="snake-icon">🐍</span> 贪吃蛇
    </div>
    <div class="score-board">
      <div>
        <div class="label">得分</div>
        <div class="value" id="scoreDisplay">0</div>
      </div>
      <div>
        <div class="label">最高</div>
        <div class="value high" id="highScoreDisplay">0</div>
      </div>
    </div>
  </div>

  <!-- 画布 -->
  <div class="canvas-container">
    <canvas id="gameCanvas" width="480" height="480"></canvas>

    <!-- 开始覆盖层 -->
    <div class="overlay" id="startOverlay">
      <div class="big-icon">🐍</div>
      <div class="primary-text">贪吃蛇</div>
      <div class="secondary-text">经典街机 — 键盘方向键控制</div>
      <button class="btn" id="startBtn">开始游戏</button>
    </div>

    <!-- 结束覆盖层 -->
    <div class="overlay hidden" id="gameOverOverlay">
      <div class="big-icon">💀</div>
      <div class="primary-text" id="finalScoreText">得分：0</div>
      <div class="secondary-text">按空格键或点击按钮重新开始</div>
      <button class="btn" id="restartBtn">再来一局</button>
    </div>
  </div>

  <!-- 底部 -->
  <div class="footer">
    <div class="hint">
      <kbd>↑</kbd> <kbd>↓</kbd> <kbd>←</kbd> <kbd>→</kbd> 或
      <kbd>W</kbd> <kbd>A</kbd> <kbd>S</kbd> <kbd>D</kbd>
       · <kbd>Space</kbd> 暂停
    </div>
    <button class="restart-btn" id="footerRestartBtn">⟳ 重新开始</button>
  </div>
</div>

<script>
  (function () {
    /* ===================================================
       配置
       =================================================== */
    const BOARD_SIZE  = 20;           // 20×20 网格
    const CELL_SIZE   = 480 / BOARD_SIZE; // 24px
    const TICK_MS     = 150;          // 毫秒/帧（速度）

    /* ===================================================
       DOM 引用
       =================================================== */
    const canvas      = document.getElementById('gameCanvas');
    const ctx         = canvas.getContext('2d');

    const scoreEl     = document.getElementById('scoreDisplay');
    const highScoreEl = document.getElementById('highScoreDisplay');
    const startOverlay  = document.getElementById('startOverlay');
    const gameOverOverlay = document.getElementById('gameOverOverlay');
    const finalScoreText = document.getElementById('finalScoreText');

    /* ===================================================
       游戏状态
       =================================================== */
    let snake     = [];        // 坐标数组 [x, y]
    let food      = { x: 8, y: 10 };
    let direction = 'RIGHT';   // 当前移动方向
    let nextDirection = 'RIGHT';
    let score     = 0;
    let highScore = 0;

    let gameLoopId   = null;
    let isRunning    = false;   // true = 游戏进行中
    let isPaused     = false;   // 暂停标记

    // 防止在单帧内多次转向
    let directionChangedThisTick = false;

    /* ===================================================
       本地存储读取最高分
       =================================================== */
    try {
      const saved = localStorage.getItem('snake_highscore');
      if (saved !== null) {
        highScore = parseInt(saved, 10) || 0;
        highScoreEl.textContent = highScore;
      }
    } catch (_) { /* 无访问权限时忽略 */ }

    /* ===================================================
       工具函数
       =================================================== */
    function saveHighScore() {
      try {
        localStorage.setItem('snake_highscore', String(highScore));
      } catch (_) { /* ignore */ }
    }

    /** 在网格内随机生成不重叠的食物 */
    function spawnFood() {
      const totalCells = BOARD_SIZE * BOARD_SIZE;
      if (snake.length >= totalCells) {
        // 蛇占满网格 → 胜利（直接返回 false）
        return false;
      }

      // 构建占用集合（用字符串提速）
      const occupied = new Set();
      for (const seg of snake) {
        occupied.add(`${seg.x},${seg.y}`);
      }

      // 如果剩余空间很少，遍历找；否则随机试
      const free = totalCells - occupied.size;
      if (free < 1) return false;

      if (free < BOARD_SIZE * 2) {
        // 空间少 → 遍历收集所有空闲格
        const candidates = [];
        for (let y = 0; y < BOARD_SIZE; y++) {
          for (let x = 0; x < BOARD_SIZE; x++) {
            if (!occupied.has(`${x},${y}`)) {
              candidates.push({ x, y });
            }
          }
        }
        if (candidates.length === 0) return false;
        const picked = candidates[Math.floor(Math.random() * candidates.length)];
        food = picked;
      } else {
        // 随机生成
        let fx, fy;
        do {
          fx = Math.floor(Math.random() * BOARD_SIZE);
          fy = Math.floor(Math.random() * BOARD_SIZE);
        } while (occupied.has(`${fx},${fy}`));
        food = { x: fx, y: fy };
      }
      return true;
    }

    /** 初始化（或重置）游戏 */
    function resetGame() {
      // 清除旧循环
      if (gameLoopId !== null) {
        clearInterval(gameLoopId);
        gameLoopId = null;
      }

      // 蛇：从中间偏左开始，长度 3
      const mid = Math.floor(BOARD_SIZE / 2);
      snake = [
        { x: mid - 1, y: mid },
        { x: mid,     y: mid },
        { x: mid + 1, y: mid },
      ];
      direction = 'RIGHT';
      nextDirection = 'RIGHT';
      score = 0;
      isPaused = false;
      directionChangedThisTick = false;

      scoreEl.textContent = '0';

      // 生成食物
      if (!spawnFood()) {
        // 极低概率失败（蛇初始占3格，不可能满）
        food = { x: mid + 4, y: mid };
      }

      draw();
    }

    /* ===================================================
       游戏结束
       =================================================== */
    function gameOver() {
      isRunning = false;

      if (gameLoopId !== null) {
        clearInterval(gameLoopId);
        gameLoopId = null;
      }

      // 更新最高分
      if (score > highScore) {
        highScore = score;
        highScoreEl.textContent = highScore;
        saveHighScore();
      }

      // 显示结束覆盖层
      finalScoreText.textContent = `得分：${score}`;
      gameOverOverlay.classList.remove('hidden');
    }

    /* ===================================================
       核心更新逻辑
       =================================================== */
    function tick() {
      if (!isRunning || isPaused) return;

      // 应用排队的方向
      direction = nextDirection;
      directionChangedThisTick = false;

      // 计算新头部
      const head = snake[snake.length - 1];
      let newHead = { ...head };

      switch (direction) {
        case 'RIGHT': newHead.x += 1; break;
        case 'LEFT':  newHead.x -= 1; break;
        case 'UP':    newHead.y -= 1; break;
        case 'DOWN':  newHead.y += 1; break;
      }

      // ---- 检测是否吃到食物 ----
      const eats = (newHead.x === food.x && newHead.y === food.y);

      // ---- 移动蛇 ----
      snake.push(newHead);
      if (!eats) {
        snake.shift(); // 没吃到 → 移除尾部
      } else {
        // 吃到 → 加分、生新食物
        score += 1;
        scoreEl.textContent = score;
        if (!spawnFood()) {
          // 所有格子占满 → 玩家胜利
          // 仍继续运行，但下次 tick 会因撞墙/撞自身而结束
          // 这里也可以直接胜利，但简单处理：继续直到撞墙
        }
      }

      // ---- 碰撞检测 ----
      const headPos = snake[snake.length - 1];

      // 撞墙
      if (headPos.x < 0 || headPos.x >= BOARD_SIZE ||
          headPos.y < 0 || headPos.y >= BOARD_SIZE) {
        gameOver();
        draw();
        return;
      }

      // 撞自身（除头部自身外）
      for (let i = 0; i < snake.length - 1; i++) {
        if (snake[i].x === headPos.x && snake[i].y === headPos.y) {
          gameOver();
          draw();
          return;
        }
      }

      // 绘制
      draw();
    }

    /* ===================================================
       渲染
       =================================================== */
    function draw() {
      ctx.clearRect(0, 0, 480, 480);

      // ---- 网格线（极淡） ----
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.03)';
      ctx.lineWidth = 0.5;
      for (let i = 0; i <= BOARD_SIZE; i++) {
        const pos = i * CELL_SIZE;
        ctx.beginPath();
        ctx.moveTo(pos, 0);
        ctx.lineTo(pos, 480);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(0, pos);
        ctx.lineTo(480, pos);
        ctx.stroke();
      }

      // ---- 蛇 ----
      for (let i = 0; i < snake.length; i++) {
        const seg = snake[i];
        const x = seg.x * CELL_SIZE;
        const y = seg.y * CELL_SIZE;
        const pad = i === snake.length - 1 ? 1 : 2; // 头部略大
        const size = CELL_SIZE - pad * 2;
        const rx = 4; // 圆角半径

        // 颜色：头部亮绿，身体渐变
        let fillColor;
        if (i === snake.length - 1) {
          fillColor = '#5cdb8a'; // 头部
        } else {
          const ratio = i / snake.length;
          const g = Math.round(160 + 60 * ratio);
          fillColor = `rgb(50, ${g}, 90)`;
        }

        ctx.fillStyle = fillColor;

        // 绘制圆角矩形
        const cx = x + pad;
        const cy = y + pad;
        const w = size;
        const h = size;
        ctx.beginPath();
        ctx.moveTo(cx + rx, cy);
        ctx.lineTo(cx + w - rx, cy);
        ctx.quadraticCurveTo(cx + w, cy, cx + w, cy + rx);
        ctx.lineTo(cx + w, cy + h - rx);
        ctx.quadraticCurveTo(cx + w, cy + h, cx + w - rx, cy + h);
        ctx.lineTo(cx + rx, cy + h);
        ctx.quadraticCurveTo(cx, cy + h, cx, cy + h - rx);
        ctx.lineTo(cx, cy + rx);
        ctx.quadraticCurveTo(cx, cy, cx + rx, cy);
        ctx.closePath();
        ctx.fill();

        // 头部眼睛
        if (i === snake.length - 1) {
          ctx.fillStyle = '#0f1f2b';
          let e1x, e1y, e2x, e2y;
          const eSize = 3;
          const eOff = 6;
          switch (direction) {
            case 'RIGHT':
              e1x = x + CELL_SIZE - eOff; e1y = y + 7;
              e2x = x + CELL_SIZE - eOff; e2y = y + CELL_SIZE - 7;
              break;
            case 'LEFT':
              e1x = x + eOff - 2; e1y = y + 7;
              e2x = x + eOff - 2; e2y = y + CELL_SIZE - 7;
              break;
            case 'UP':
              e1x = x + 7; e1y = y + eOff - 2;
              e2x = x + CELL_SIZE - 7; e2y = y + eOff - 2;
              break;
            case 'DOWN':
              e1x = x + 7; e1y = y + CELL_SIZE - eOff;
              e2x = x + CELL_SIZE - 7; e2y = y + CELL_SIZE - eOff;
              break;
            default:
              e1x = x + 7; e1y = y + 7;
              e2x = x + CELL_SIZE - 7; e2y = y + 7;
          }
          ctx.beginPath();
          ctx.arc(e1x, e1y, eSize, 0, Math.PI * 2);
          ctx.fill();
          ctx.beginPath();
          ctx.arc(e2x, e2y, eSize, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      // ---- 食物 ----
      const fx = food.x * CELL_SIZE;
      const fy = food.y * CELL_SIZE;
      const fSize = CELL_SIZE - 4;
      const fHalf = fSize / 2;

      // 发光
      const glow = ctx.createRadialGradient(fx + fHalf, fy + fHalf, 2, fx + fHalf, fy + fHalf, fHalf + 6);
      glow.addColorStop(0, 'rgba(255, 200, 80, 0.5)');
      glow.addColorStop(1, 'rgba(255, 200, 80, 0)');
      ctx.fillStyle = glow;
      ctx.beginPath();
      ctx.arc(fx + fHalf, fy + fHalf, fHalf + 6, 0, Math.PI * 2);
      ctx.fill();

      // 食物本体（苹果样式）
      const gradient = ctx.createRadialGradient(fx + 6, fy + 6, 2, fx + fHalf, fy + fHalf, fHalf);
      gradient.addColorStop(0, '#ff6b4a');
      gradient.addColorStop(0.7, '#d9452a');
      gradient.addColorStop(1, '#a62e18');
      ctx.fillStyle = gradient;
      ctx.beginPath();
      ctx.arc(fx + fHalf, fy + fHalf, fHalf, 0, Math.PI * 2);
      ctx.fill();

      // 高光
      ctx.fillStyle = 'rgba(255, 255, 255, 0.25)';
      ctx.beginPath();
      ctx.arc(fx + 8, fy + 7, 3.5, 0, Math.PI * 2);
      ctx.fill();

      // 叶子
      ctx.fillStyle = '#4aad6a';
      ctx.beginPath();
      ctx.ellipse(fx + fHalf + 1, fy + 5, 5, 3, 0.4, 0, Math.PI * 2);
      ctx.fill();
    }

    /* ===================================================
       游戏启动 / 停止
       =================================================== */
    function startGame() {
      resetGame();
      isRunning = true;
      startOverlay.classList.add('hidden');
      gameOverOverlay.classList.add('hidden');

      if (gameLoopId !== null) {
        clearInterval(gameLoopId);
      }
      gameLoopId = setInterval(tick, TICK_MS);
    }

    function restartGame() {
      startGame();
    }

    /* ===================================================
       键盘事件
       =================================================== */
    function handleKeyDown(e) {
      const key = e.key;

      // 防止页面滚动
      const arrowKeys = ['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'];
      if (arrowKeys.includes(key)) {
        e.preventDefault();
      }

      // --- 如果游戏未运行（覆盖层显示时），只有 Enter/空格 能启动 ---
      if (!isRunning) {
        if (key === 'Enter' || key === ' ') {
          e.preventDefault();
          startGame();
        }
        return;
      }

      // --- 游戏运行中 ---

      // 空格：暂停/继续
      if (key === ' ') {
        e.preventDefault();
        isPaused = !isPaused;
        return;
      }

      // 方向控制（不允许原地掉头）
      if (directionChangedThisTick) return;

      let desired = null;
      switch (key) {
        case 'ArrowUp':    case 'w': case 'W': desired = 'UP';    break;
        case 'ArrowDown':  case 's': case 'S': desired = 'DOWN';  break;
        case 'ArrowLeft':  case 'a': case 'A': desired = 'LEFT';  break;
        case 'ArrowRight': case 'd': case 'D': desired = 'RIGHT'; break;
      }
      if (!desired) return;

      // 不允许 180° 掉头
      if ((direction === 'UP'    && desired === 'DOWN')  ||
          (direction === 'DOWN'  && desired === 'UP')    ||
          (direction === 'LEFT'  && desired === 'RIGHT') ||
          (direction === 'RIGHT' && desired === 'LEFT')) {
        return;
      }

      nextDirection = desired;
      directionChangedThisTick = true;
    }

    /* ===================================================
       绑定事件
       =================================================== */
    window.addEventListener('keydown', handleKeyDown);

    document.getElementById('startBtn').addEventListener('click', startGame);
    document.getElementById('restartBtn').addEventListener('click', restartGame);
    document.getElementById('footerRestartBtn').addEventListener('click', () => {
      if (isRunning) {
        restartGame();
      } else {
        resetGame();
        draw();
        startOverlay.classList.remove('hidden');
        gameOverOverlay.classList.add('hidden');
      }
    });

    // 点击"Game Over"覆盖层任意处也可重新开始
    gameOverOverlay.addEventListener('click', (e) => {
      if (e.target === gameOverOverlay || e.target.tagName === 'DIV') {
        restartGame();
      }
    });

    /* ===================================================
       初次渲染
       =================================================== */
    resetGame();
    draw();
  })();
</script>
</body>
</html>
